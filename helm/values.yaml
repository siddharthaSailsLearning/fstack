replicaCount: 1
image:
  repository: gcr.io/my-webapp-project/webapp-images  
  tag: "latest"  
  pullPolicy: IfNotPresent
db:
  rootPassword: root
  database: appdb
  user: appuser
  password: apppass
  port: 3306
backend:
  port: 3000
  dbHost: db  
frontend:
  port: 80
service:
  type: LoadBalancer 
  port: 80
persistence:
  enabled: true
  size: 5Gi