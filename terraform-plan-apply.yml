trigger:
  branches:
    include:
    - main
  paths:
    include:
    - terraform/*

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: gcp-creds  # GCP keys

stages:
- stage: Plan
  jobs:
  - job: TerraformPlan
    steps:
    - task: TerraformInstaller@0
      inputs:
        terraformVersion: '1.0.0'
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'  # But use google provider
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        backendServiceArm: 'terraform-state'  # Optional remote state
        backendAzureRmResourceGroupName: 'rg-terraform'
        backendAzureRmStorageAccountName: 'stterraform'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'
        env:
          GOOGLE_CREDENTIALS: $(GCP_SA_KEY_TERRAFORM)
    - task: TerraformTaskV4@4
      inputs:
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        environmentServiceNameAzureRM: 'gcp-auth'  # Custom connector if needed
        env:
          TF_VAR_gcp_sa_key: $(GCP_SA_KEY_TERRAFORM)
          TF_VAR_project_id: 'my-webapp-project'
    # Manual approval gate to Apply in prod

- stage: Apply
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - deployment: TerraformApply
    environment: 'production'  # Gate here
    strategy:
      runOnce:
        deploy:
          steps:
          - task: TerraformTaskV4@4
            inputs:
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              environmentServiceNameAzureRM: 'gcp-auth'
              commandOptions: '-auto-approve'
              env:
                TF_VAR_gcp_sa_key: $(GCP_SA_KEY_TERRAFORM)
                TF_VAR_project_id: 'my-webapp-project'