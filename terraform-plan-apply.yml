trigger:
  branches:
    include:
      - main

variables:
  - group: terraform-deploy
 

stages:

- stage: Plan
  displayName: 'Backend bucket check + Terraform plan'
  jobs:
  - job: TerraformPlan
    displayName: 'Ensure backend bucket, init & plan'
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - task: DownloadSecureFile@1
      name: download_sa
      inputs:
        secureFile: '$(SERVICE_ACCOUNT_SECUREFILE)'

    - task: GoogleCloudCLI@0
      displayName: 'Ensure GCS backend bucket exists'
      inputs:
        serviceAccountKey: '$(Agent.TempDirectory)/$(SERVICE_ACCOUNT_SECUREFILE)'
        project: '$(PROJECT_ID)'
        args: >
          bash -c "
          set -euo pipefail
          
          if ! gsutil ls -b gs://$(GCS_BACKEND_BUCKET) >/dev/null 2>&1; then
            echo 'Creating bucket: $(GCS_BACKEND_BUCKET)'
            gsutil mb -p $(PROJECT_ID) -l $(LOCATION) gs://$(GCS_BACKEND_BUCKET)
            gsutil versioning set on gs://$(GCS_BACKEND_BUCKET)
            echo 'Bucket created and versioning enabled.'
          else
            echo 'Bucket exists; ensure versioning is on (idempotent).'
            gsutil versioning set on gs://$(GCS_BACKEND_BUCKET) || true
          fi
          "

    - task: TerraformInstaller@0
      displayName: 'Install Terraform 1.5.7'
      inputs:
        terraformVersion: '1.5.7'

    - task: TerraformCLI@0
      displayName: 'Terraform init (GCS backend)'
      inputs:
        provider: 'google'      
        command: 'init'
        workingDirectory: '$(TERRAFORM_WORKING_DIR)'
        commandOptions: >
          -backend-config="bucket=$(GCS_BACKEND_BUCKET)"
          -backend-config="prefix=$(BUCKET_PREFIX)"
      env:
        GOOGLE_APPLICATION_CREDENTIALS: '$(Agent.TempDirectory)/$(SERVICE_ACCOUNT_SECUREFILE)'
        TF_VAR_project_id: '$(PROJECT_ID)'
        TF_VAR_region: '$(LOCATION)'

    - task: TerraformCLI@0
      displayName: 'Terraform validate'
      inputs:
        provider: 'google'
        command: 'validate'
        workingDirectory: '$(TERRAFORM_WORKING_DIR)'
      env:
        GOOGLE_APPLICATION_CREDENTIALS: '$(Agent.TempDirectory)/$(SERVICE_ACCOUNT_SECUREFILE)'

    - task: TerraformCLI@0
      displayName: 'Terraform plan (write tfplan.binary and tfplan.txt)'
      inputs:
        provider: 'google'
        command: 'plan'
        workingDirectory: '$(TERRAFORM_WORKING_DIR)'
        commandOptions: '-out=tfplan.binary -input=false'
      env:
        GOOGLE_APPLICATION_CREDENTIALS: '$(Agent.TempDirectory)/$(SERVICE_ACCOUNT_SECUREFILE)'
        TF_VAR_project_id: '$(PROJECT_ID)'
        TF_VAR_region: '$(LOCATION)'



- stage: Apply
  displayName: 'Terraform apply/destroy (modules)'
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - job: TerraformApply
    displayName: 'Apply or Destroy with Terraform plan'
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - task: TerraformInstaller@0
      displayName: 'Install Terraform 1.5.7 (apply agent)'
      inputs:
        terraformVersion: '1.5.7'

    - task: TerraformCLI@0
      displayName: 'Terraform init (apply)'
      inputs:
        provider: 'google'
        command: 'init'
        workingDirectory: '$(TERRAFORM_WORKING_DIR)'
        commandOptions: >
          -backend-config="bucket=$(GCS_BACKEND_BUCKET)"
          -backend-config="prefix=$(BUCKET_PREFIX)"
      env:
        GOOGLE_APPLICATION_CREDENTIALS: '$(Agent.TempDirectory)/$(SERVICE_ACCOUNT_SECUREFILE)'
        TF_VAR_project_id: '$(PROJECT_ID)'
        TF_VAR_region: '$(LOCATION)'

    - task: TerraformCLI@0
      displayName: 'Terraform apply/destroy (execute plan if present)'
      inputs:
        provider: 'google'
        command: 'apply'
        workingDirectory: '$(TERRAFORM_WORKING_DIR)'
        commandOptions: > 
          -auto-approve
      env:
        GOOGLE_APPLICATION_CREDENTIALS: '$(Agent.TempDirectory)/$(SERVICE_ACCOUNT_SECUREFILE)'
        TF_VAR_project_id: '$(PROJECT_ID)'
        TF_VAR_region: '$(LOCATION)'
